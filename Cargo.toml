[package]
name = "go-xlr-utility-volume-button"
version = "0.1.0"
edition = "2021"
description = "Intercepts Windows volume keys and forwards them to the GoXLR Utility Game channel via WebSocket"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
